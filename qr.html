<!DOCTYPE html>
<html>
<head>
  <title>Scan QR</title>
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      font-family: Arial, sans-serif;
      text-align: center;
    }
    img {
      margin: 20px 0;
    }
    p {
      color: #666;
    }

</html>
